<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="redDartboard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4757"/>
      <stop offset="100%" style="stop-color:#c0392b"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#redDartboard)"/>
  
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="28" fill="#e74c3c" stroke="#fff" stroke-width="2"/>
  
  <!-- Second ring -->
  <circle cx="32" cy="32" r="22" fill="#fff"/>
  
  <!-- Third ring -->
  <circle cx="32" cy="32" r="16" fill="#e74c3c"/>
  
  <!-- Fourth ring -->
  <circle cx="32" cy="32" r="10" fill="#fff"/>
  
  <!-- Bullseye -->
  <circle cx="32" cy="32" r="5" fill="#c0392b"/>
  
  <!-- Center dot -->
